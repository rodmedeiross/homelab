# Database streams live here instead of the NPM UI: the UI writes a fixed
# `proxy_pass name:port`, which nginx resolves only when the config loads, so a
# recreated container (new IP) stays unreachable until a reload. With a variable,
# nginx asks Docker's DNS again for every new connection.
# Mounted as /srv/npm/custom, a symlink to this folder in the homelab clone. After a
# change: git pull on willy, then `docker exec npm nginx -t && docker exec npm nginx -s reload`.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 5432;
  listen [::]:5432;
  set $upstream postgres:5432;
  proxy_pass $upstream;
}

server {
  listen 5433;
  listen [::]:5433;
  set $upstream pgvector:5432;
  proxy_pass $upstream;
}

server {
  listen 6379;
  listen [::]:6379;
  set $upstream redis:6379;
  proxy_pass $upstream;
}

server {
  listen 3306;
  listen [::]:3306;
  set $upstream mariadb:3306;
  proxy_pass $upstream;
}
