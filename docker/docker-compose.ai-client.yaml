name: ai-client

networks:
  proxy:
    external: true
  mcp_net:
    driver: bridge

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      # Allow fetching URLs that resolve to private/local IPs
      ENABLE_RAG_LOCAL_WEB_FETCH: "true"
    volumes:
      - /srv/ai/openwebui/data:/app/backend/data:rw
    networks: [proxy]
    labels:
      - com.centurylinklabs.watchtower.enable=true

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    user: "1000:1000"
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: ${GENERIC_TIMEZONE}
      EXECUTIONS_MODE: queue
      N8N_HOST: ${N8N_HOST:-n8n.local}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
      N8N_RUNNERS_ENABLED: true
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:-your-secret-here}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_NATIVE_PYTHON_RUNNER: true
      N8N_METRICS: true
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_PROXY_HOPS: 1
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUE_BULL_REDIS_HOST: ${REDIS_HOST}
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /srv/n8n:/home/node/.n8n:rw
    networks: [proxy]
    labels:
      - com.centurylinklabs.watchtower.enable=true

  n8n-task-runners:
    image: n8nio/runners:latest
    container_name: n8n-runners
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:-your-secret-here}
    depends_on:
      - n8n
    networks: [proxy]
    labels:
      - com.centurylinklabs.watchtower.enable=true

  mcp-gateway:
    image: docker/mcp-gateway:latest
    container_name: mcp-gateway
    restart: unless-stopped
    # No raw docker.sock: all servers are remote, so the gateway never
    # spawns stdio containers. Point it at the existing read-mostly socket proxy
    # (infra-core `dockerproxy`, POST=0) so any docker ping is filtered.
    environment:
      - DOCKER_HOST=tcp://dockerproxy:2375
    # The gateway enumerates remote tools once at boot and does not retry, so it
    # must start only after honcho-mcp and ai-memory are actually listening.
    depends_on:
      honcho-mcp:
        condition: service_healthy
      ai-memory:
        condition: service_healthy
      infisical-agent:
        condition: service_healthy
    command:
      - --transport=streaming
      - --port=8811
      # Newer gateway images enforce a trusted-root check: catalog files must
      # live under ~/.docker/mcp/catalogs (root user here), so the config dir
      # is mounted there and both flags point inside it.
      - --catalog=/root/.docker/mcp/catalogs/catalog.yaml
      # --servers replaces registry.yaml: just name the catalog entries to enable.
      - --servers=honcho,ai-memory
      - --secrets=/root/.docker/mcp/catalogs/secrets.env
    volumes:
      - /srv/ai/mcp-gateway/config:/root/.docker/mcp/catalogs:ro
    ports:
      - "8811:8811"
    networks: [proxy, mcp_net]
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Renders /mcp/secrets.env from Infisical before the gateway starts.
  infisical-agent:
    image: infisical/cli:latest
    container_name: infisical-agent
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/agent/entrypoint.sh"]
    environment:
      - INFISICAL_AGENT_CLIENT_ID=${INFISICAL_AGENT_CLIENT_ID}
      - INFISICAL_AGENT_CLIENT_SECRET=${INFISICAL_AGENT_CLIENT_SECRET}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
    volumes:
      - /srv/ai/mcp-gateway/agent:/agent:ro
      - /srv/ai/mcp-gateway/config:/out
    tmpfs:
      - /auth
    healthcheck:
      test: ["CMD-SHELL", "test -f /out/secrets.env"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [proxy]
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Honcho MCP worker wraps the remote honcho-api as an MCP server for the gateway.
  honcho-mcp:
    image: harbor.${DOMAIN}/homelab/honcho-mcp:latest
    container_name: honcho-mcp
    restart: unless-stopped
    environment:
      - HONCHO_API_URL=${HONCHO_API_URL}
    # Gate the gateway on this: TCP-connect to 8787 once wrangler dev has bound it.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(8787,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [mcp_net]
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Project-memory wiki (github.com/akitaonrails/ai-memory). MCP clients reach
  # it through the gateway; hooks/CLI/web UI come in via NPM over TLS — no host
  # port on purpose. Digest-pinned (fast-moving upstream): bump deliberately,
  # so no watchtower label. Healthcheck ships in the image.
  ai-memory:
    image: akitaonrails/ai-memory:1.29.0@sha256:1d8a2ca7d7bc2349ba964d2d97dafb683632676460c1e373083f919a18c60d37
    container_name: ai-memory
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: America/Sao_Paulo
      AI_MEMORY_AUTH_TOKEN: ${AI_MEMORY_AUTH_TOKEN}
      # Host-header allowlist (DNS-rebinding guard). Setting it REPLACES the
      # image default, so loopback entries must be repeated (healthcheck).
      AI_MEMORY_ALLOWED_HOSTS: "localhost,127.0.0.1,::1,ai-memory,ai-memory.${DOMAIN}"
      # Consolidation LLM via LiteLLM (mobydick). All four unset = zero-LLM
      # mode: FTS5 search + rule-based summaries, still fully functional.
      AI_MEMORY_LLM_PROVIDER: ${AI_MEMORY_LLM_PROVIDER:-}
      AI_MEMORY_LLM_MODEL: ${AI_MEMORY_LLM_MODEL:-}
      LLM_BASE_URL: ${AI_MEMORY_LLM_BASE_URL:-}
      LLM_API_KEY: ${AI_MEMORY_LLM_API_KEY:-}
    volumes:
      - /srv/ai/ai-memory/data:/data
    networks: [proxy, mcp_net]
